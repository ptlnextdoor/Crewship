task:
  maxRecursionDepth: 0
# No skills: the lanes run as the owner, so every session would otherwise load the owner's user-scope
# skills (29 entries, about 1,060 tokens, measured 2026-11-08) behind "Matching skill -> MUST read
# skill://<name> first"; none is named by a forge prompt, and a reviewer reading `ponytail-review`
# ("use for 'review my PR'") follows rules reviewer.md did not write.
skills:
  enabled: false
# No memory: the lanes run as the owner, whose `memory.backend` is `mnemopi`, so every session got
# `recall`/`retain`/`reflect`/`memory_edit` and retention of its turns into a bank keyed to its cwd. A cycle's
# builder, repair, merge-resolve and reviewer sessions all run in its worktree and share one bank, so the
# reviewer was handed the builder's own retained turns outside the diff (15 of 131 ticket banks on this box,
# measured 2026-11-11), and the planner and steward recalled earlier cycles from the lane checkout's bank
# (arXiv 2611.07554: notes written during legitimate stale-test repairs lead agents to weaken correct tests).
# Quoted for YAML 1.1 readers; omp's parser reads bare `off` as the string.
memory:
  backend: "off"
