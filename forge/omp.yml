task:
  maxRecursionDepth: 0
# No skills: the lanes run as the owner, so every session would otherwise load the owner's user-scope
# skills (29 entries, about 1,060 tokens, measured 2026-11-08) behind "Matching skill -> MUST read
# skill://<name> first"; none is named by a forge prompt, and a reviewer reading `ponytail-review`
# ("use for 'review my PR'") follows rules reviewer.md did not write.
skills:
  enabled: false
# No memory: the lanes run as the owner, whose `memory.backend` is `mnemopi`, so every session got
# `recall`/`retain`/`reflect`/`memory_edit` and automatic retention of completed turns into the owner's
# store. A bank is keyed to the session's working directory, and a lane's worktree (`<ticket>-<hash>`) is
# removed when the ticket merges, so the 131 ticket banks on this box (6,771 rows, 85.5 MB, measured
# 2026-11-11) were written by lane sessions and recalled by none; where a path does come back, memory
# written in one attempt is context the next session's prompt never wrote (arXiv 2611.07554: notes written
# during legitimate stale-test repairs lead agents to weaken correct tests). Quoted: bare `off` is false.
memory:
  backend: "off"
