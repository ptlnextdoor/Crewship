# Project config for the forge loop (forge/README.md). Copy to ~/.config/forge/<name>.toml.
name = "reflex1"
repo = "~/Dev/reflex1"
gate = "./gate.sh"
# Parallel builder lanes (owner 2026-10-23: use the Claude plan hard). Each lane: own clone, worktree, cargo target.
lanes = 4
min_queue = 6
max_attempts = 3
steward_every = 4
protected_paths = ["gate.sh", "tickets/", ".forge/"]

[limits]
# Stop at this UTC time (12 h after launch). Final steward pass, then GPU reap.
deadline = "2026-10-24T17:00:00Z"
# Pause when any Claude/Codex usage window passes this percent, so the owner keeps headroom.
max_window_used_pct = 80
gate_timeout_min = 30

[env]
GPU_BUDGET_USD = "15"
GPU_MAX_HOURS = "2"
GPU_MIN_BALANCE = "3"
CARGO_TARGET_DIR = "~/.cache/forge/reflex1-target"
# Line-number debug info only for every dev/test build a lane runs: backtraces keep file:line, the variable
# and type tables go. Measured on lane 1 (2026-11-13): each of the 168 test binaries is 309 MB, 289 MB of it
# DWARF (.debug_loc 87, .debug_info 99, .debug_str 65 MB); the four lanes' target dirs hold 106 of 193 GB.
# Set here rather than in reflex1's Cargo.toml so the owner's own checkout keeps full debug info.
CARGO_PROFILE_DEV_DEBUG = "line-tables-only"
HF_HOME = "~/.cache/huggingface"

# Routing (owner, 2026-10-23): Opus 5.5, Fable 5.1, GPT 6.1 Sol and GPT 6 Astra, high effort.
# Builders alternate vendors by role; the reviewer is always from the other vendor.
[roles.planner]
model = "anthropic/claude-fable-5-1"
thinking = "xhigh"
timeout_min = 40
fallback = ["openai-codex/gpt-6.1-sol"]

[roles.builder]
# Claude first (owner: "use claude"); Codex Plus 5h window is small and is the fallback.
model = "anthropic/claude-opus-5-5"
thinking = "high"
timeout_min = 75
fallback = ["anthropic/claude-fable-5-1", "openai-codex/gpt-6.1-sol"]

[roles.builder_hard]
model = "anthropic/claude-opus-5-5"
thinking = "xhigh"
timeout_min = 90
fallback = ["openai-codex/gpt-6.1-sol"]

[roles.reviewer]
# Builders are Claude now, so cross-vendor review goes to Codex Astra when it has quota (reviewer_alt);
# this role reviews Codex-built work.
model = "anthropic/claude-opus-5-5"
thinking = "high"
fallback = ["anthropic/claude-fable-5-1"]

[roles.reviewer_alt]
model = "openai-codex/gpt-6-astra"
thinking = "high"
# Same-vendor review is the compromise when Codex is out; Fable is a different model than the Opus builder.
fallback = ["anthropic/claude-fable-5-1"]

[roles.steward]
model = "anthropic/claude-fable-5-1"
thinking = "medium"
fallback = ["openai-codex/gpt-6.1-sol"]
